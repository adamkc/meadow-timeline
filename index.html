<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meadow</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f10; overflow: hidden; font: 13px/1.5 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #veil { position: fixed; inset: 0; display: grid; place-items: center; background: #c9b79c; color: #4d4335; font-size: 15px; opacity: 1; pointer-events: none; transition: opacity 1.2s ease; }
  #stats { position: fixed; left: 12px; top: 10px; padding: 3px 8px; border-radius: 4px; background: rgba(8, 12, 10, .6); color: #fff; font-size: 12px; pointer-events: none; }
  #error { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; color: #fff; font-size: 15px; text-align: center; }

  /* The timeline: what stage this is, and a track to move through the stages. */
  #timeline { position: fixed; left: 0; right: 0; bottom: 0; padding: 40px 28px 12px; color: #fff; pointer-events: none;
              background: linear-gradient(transparent, rgba(8, 12, 10, .72) 55%); text-shadow: 0 1px 3px rgba(0, 0, 0, .7); }
  #timeline > * { pointer-events: auto; }
  #stage-title { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .01em; }
  #stage-text { margin: 2px 0 14px; max-width: 62ch; font-size: 14px; opacity: .92; text-wrap: pretty; }
  #row { display: flex; align-items: flex-start; gap: 18px; }
  #play { flex: none; width: 64px; margin-top: -7px; padding: 5px 0; border: 1px solid rgba(255, 255, 255, .55); border-radius: 6px;
          background: rgba(255, 255, 255, .1); color: inherit; font: inherit; cursor: pointer; }
  #play:hover, #play:focus-visible, #wide:hover, #wide:focus-visible { background: rgba(255, 255, 255, .22); outline: none; }
  #wide { position: absolute; right: 28px; top: 36px; padding: 5px 12px; border: 1px solid rgba(255, 255, 255, .55); border-radius: 6px;
          background: rgba(255, 255, 255, .1); color: inherit; font: inherit; cursor: pointer; text-shadow: inherit; }
  #scale { flex: 1; min-width: 0; margin: 0 46px 0 40px; }
  #track { position: relative; height: 18px; cursor: pointer; touch-action: none; }
  #track::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .28); }
  #done { position: absolute; left: 0; top: 7px; height: 4px; border-radius: 2px; background: #cfe3a8; }
  #knob { position: absolute; top: 1px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .5); }
  #stops { position: relative; height: 34px; }
  #stops button { position: absolute; top: 2px; transform: translateX(-50%); padding: 8px 2px 0; border: 0; background: none; color: inherit;
                  font: inherit; font-size: 12px; white-space: nowrap; opacity: .62; cursor: pointer; }
  #stops button::before { content: ""; position: absolute; left: 50%; top: 0; width: 1px; height: 6px; background: currentColor; }
  #stops button:hover, #stops button:focus-visible, #stops button.on { opacity: 1; outline: none; }
  #stops button.on { font-weight: 600; }
  #hud { margin-top: 2px; font-size: 12px; opacity: .7; }
  #hud b { font-weight: 600; }
  @media (max-width: 860px) {            /* narrow screens: only the current stage is named */
    #timeline { padding: 30px 14px 10px; }
    #wide { right: 14px; top: 26px; }
    #scale { margin: 0 10px; }
    #stops button:not(.on) { font-size: 0; }
    #hud { display: none; }
  }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="veil">Loading the meadow…</div>
<div id="timeline">
  <button id="wide" type="button">Landscape view</button>
  <h1 id="stage-title"></h1>
  <p id="stage-text"></p>
  <div id="row">
    <button id="play" type="button">Play</button>
    <div id="scale">
      <div id="track" role="slider" aria-label="Stage of the meadow's history" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"><div id="done"></div><div id="knob"></div></div>
      <div id="stops"></div>
    </div>
  </div>
  <div id="hud"></div>
</div>
<div id="stats" hidden></div>
<div id="error"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
