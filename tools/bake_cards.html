<!doctype html>
<meta charset="utf-8">
<title>Bake tree cards</title>
<!--
  Renders each tree in a Poly Haven model from several sides into "cards":
    A  colour (sRGB) with coverage in alpha
    B  normal x, y (camera space), sunlit fraction for this scene's sun, sky visibility
  Driven by tools/bake.mjs, which reads the results out of window.__bake.
  Query: asset=<id>&alpha=<alpha map file>&tint=r,g,b (needle colour grade)&cw=&ch=&views=&jitters=
    proc=cornlily|sedge|rush|willow   build the plant from scratch (tools/proc_plants.js); made=<n> how many
    snag=1                 a dead tree: needles and twigs left out, wood weathered grey
    cutout=all             apply the alpha map to every material (grass, flowers)
    pick=<regex>           use only the pieces whose names match
    split=1                a model that is one mesh holding several plants in a row: cut it into the plants
    scatter=n,w,d,s0,s1    make patches instead: n pieces strewn over w x d metres, scaled s0..s1
    variants=<k>           how many patches to make (default 3)
-->
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const P = new URLSearchParams(location.search);
const asset = P.get('asset');
const CW = Number(P.get('cw') ?? 512), CH = Number(P.get('ch') ?? 1408), VIEWS = Number(P.get('views') ?? 8);
const log = (m) => { document.body.textContent = m; console.log('bake: ' + m); };
window.__bake = { done: false, error: null, trees: [] };

try {
  const meta = await (await fetch('../data/meta.json')).json();
  const sun = new THREE.Vector3(...meta.sun.dir).normalize();
  const renderer = new THREE.WebGLRenderer({ antialias: false });
  const gl = renderer.getContext(), dbg = gl.getExtension('WEBGL_debug_renderer_info');
  window.__bake.gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'unknown';

  log(`loading ${asset}`);
  // proc=<kind> builds the plant from scratch (tools/proc_plants.js) instead of loading a scan.
  const PROC = P.get('proc');
  const gltf = PROC ? { scene: { children: (await import('./proc_plants.js')).buildPlants(PROC, Number(P.get('made') ?? 3)) } }
    : await new GLTFLoader().loadAsync(`../raw/${asset}/${asset}.gltf`);
  // Needle triangles are smaller than a pixel, so mipmapping would pick a tiny,
  // blurred copy of the atlas: wrong colour and almost no coverage. Sample the
  // full-size texture instead; the jittered accumulation does the filtering.
  const sharp = (t) => { t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; t.needsUpdate = true; };
  let alphaMap = null;
  if (P.get('alpha')) {
    alphaMap = await new THREE.TextureLoader().loadAsync(`../raw/${asset}/${P.get('alpha')}`);
    alphaMap.flipY = false; // glTF texture convention
    alphaMap.colorSpace = THREE.NoColorSpace;
    alphaMap.wrapS = alphaMap.wrapT = THREE.RepeatWrapping;
    sharp(alphaMap);
  }

  const VS = /* glsl */ `
    uniform mat3 uMapMatrix; uniform mat4 uLightVP;
    varying vec2 vUv; varying vec2 vUvRaw; varying vec3 vN; varying vec4 vLight; varying vec3 vColor;
    void main() {
      vColor = vec3(1.0);
      #ifdef USE_COLOR
        vColor = color.rgb;
      #endif
      vUvRaw = uv; vUv = (uMapMatrix * vec3(uv, 1.0)).xy;
      vN = normalize(mat3(modelMatrix) * normal);
      vec4 w = modelMatrix * vec4(position, 1.0);
      vLight = uLightVP * w;
      gl_Position = projectionMatrix * viewMatrix * w;
    }`;
  const FS = /* glsl */ `
    uniform sampler2D uMap; uniform sampler2D uAlphaMap; uniform sampler2D uShadow;
    uniform float uUseAlpha; uniform int uMode; uniform float uBias; uniform float uTexel; uniform vec3 uTint; uniform float uGrey;
    varying vec2 vUv; varying vec2 vUvRaw; varying vec3 vN; varying vec4 vLight; varying vec3 vColor;
    void main() {
      if (uUseAlpha > 0.5 && texture2D(uAlphaMap, vUvRaw).r < 0.5) discard;
      if (uMode == 0) {                                                                  // colour, as stored
        vec3 c = texture2D(uMap, vUv).rgb * uTint * vColor;
        if (uGrey > 0.5) c = mix(c, vec3(dot(c, vec3(0.3, 0.5, 0.2))) * vec3(1.32, 1.26, 1.18) + 0.06, 0.82); // sun-bleached wood
        gl_FragColor = vec4(c, 1.0);
      }
      else if (uMode == 1) {                                                             // normal toward the camera
        vec3 n = normalize(mat3(viewMatrix) * vN); if (n.z < 0.0) n = -n;
        gl_FragColor = vec4(n * 0.5 + 0.5, 1.0);
      } else if (uMode == 2) {                                                           // lit by the current light?
        vec3 p = vLight.xyz / vLight.w * 0.5 + 0.5;
        float lit = 0.0;
        for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++)
          lit += step(p.z - uBias, texture2D(uShadow, p.xy + vec2(float(i), float(j)) * uTexel).r);
        gl_FragColor = vec4(vec3(lit / 9.0), 1.0);
      } else { gl_FragColor = vec4(1.0); }                                                // depth only
    }`;

  // One bake material per source material, sharing the mode and light uniforms.
  const SNAG = P.get('snag') === '1';
  const sharedU = { uMode: { value: 0 }, uShadow: { value: null }, uLightVP: { value: new THREE.Matrix4() },
    uBias: { value: 0.002 }, uTexel: { value: 1 / 4096 }, uGrey: { value: SNAG ? 1 : 0 } };
  const bakeMaterials = new Map();
  const tint = new THREE.Vector3(...(P.get('tint') ?? '1,1,1').split(',').map(Number)); // applied to needles and twigs only
  const white = new THREE.DataTexture(new Uint8Array([128, 128, 128, 255]), 1, 1); white.needsUpdate = true;
  function bakeMaterial(src) {
    if (bakeMaterials.has(src)) return bakeMaterials.get(src);
    const map = src.map ?? white;
    map.colorSpace = THREE.NoColorSpace; // pass sRGB bytes straight through
    sharp(map);
    map.updateMatrix();
    // The exported twig materials don't always say they are cut-outs, so go by name.
    const cutout = !!alphaMap && (P.get('cutout') === 'all' || src.transparent || src.alphaTest > 0 || /twig/i.test(src.name));
    const m = new THREE.ShaderMaterial({
      uniforms: { ...sharedU, uMap: { value: map }, uMapMatrix: { value: map.matrix.clone() },
        uAlphaMap: { value: alphaMap ?? white }, uUseAlpha: { value: cutout ? 1 : 0 },
        uTint: { value: cutout ? tint : new THREE.Vector3(1, 1, 1) } },
      // Vertex colours only for the plants built here; in the scans they are masks, not colours.
      vertexShader: VS, fragmentShader: FS, side: THREE.DoubleSide, vertexColors: !!PROC,
    });
    bakeMaterials.set(src, m);
    return m;
  }

  const scene = new THREE.Scene();
  let roots = gltf.scene.children.filter((c) => c.isMesh || c.children.length);
  for (const r of roots) {
    r.traverse((o) => {
      if (!o.isMesh) return;
      if (SNAG && /twig/i.test(o.material.name)) o.visible = false;
      o.material = Array.isArray(o.material) ? o.material.map(bakeMaterial) : bakeMaterial(o.material);
    });
    r.position.set(0, 0, 0);
  }
  if (P.get('split') === '1') { // one mesh holding a row of plants: cut at the gaps along x
    const cut = [];
    for (const r of roots) r.traverse((o) => {
      if (!o.isMesh) return;
      const g = o.geometry, pos = g.attributes.position, idx = g.index.array;
      const cx = new Float32Array(idx.length / 3);
      let lo = Infinity, hi = -Infinity;
      for (let t = 0; t < cx.length; t++) { cx[t] = (pos.getX(idx[t * 3]) + pos.getX(idx[t * 3 + 1]) + pos.getX(idx[t * 3 + 2])) / 3; lo = Math.min(lo, cx[t]); hi = Math.max(hi, cx[t]); }
      const BIN = 0.01, used = new Uint8Array(Math.ceil((hi - lo) / BIN) + 1);
      for (const x of cx) used[Math.floor((x - lo) / BIN)] = 1;
      const spans = []; let start = -1, gap = 0;
      for (let b = 0; b <= used.length; b++) {
        if (used[b]) { if (start < 0) start = b; gap = 0; } else if (start >= 0 && (++gap > 6 || b === used.length)) { spans.push([lo + start * BIN, lo + (b - gap + 1) * BIN]); start = -1; }
      }
      spans.forEach(([x0, x1], k) => {
        const keep = []; let sx = 0, sz = 0, n = 0;
        for (let t = 0; t < cx.length; t++) if (cx[t] >= x0 && cx[t] <= x1) { keep.push(idx[t * 3], idx[t * 3 + 1], idx[t * 3 + 2]); sx += cx[t]; sz += pos.getZ(idx[t * 3]); n++; }
        if (n < 50) return;
        const part = new THREE.BufferGeometry();
        for (const name in g.attributes) part.setAttribute(name, g.attributes[name]);
        part.setIndex(keep);
        const mesh = new THREE.Mesh(part, o.material);
        mesh.position.set(-sx / n, 0, -sz / n); // stand each plant on the origin
        const group = new THREE.Group(); group.name = `${o.name}_${k}`; group.add(mesh);
        cut.push(group);
      });
    });
    roots = cut;
  }
  if (P.get('pick')) { const re = new RegExp(P.get('pick')); roots = roots.filter((r) => re.test(r.name)); }
  if (P.get('scatter')) { // patches of several pieces, e.g. a clump of meadow grass from single tufts
    const [n, w, d, s0, s1] = P.get('scatter').split(',').map(Number);
    let seed = 12345;
    const rand = () => { seed = (Math.imul(seed, 1664525) + 1013904223) | 0; return (seed >>> 8) / 16777216; };
    const pieces = roots;
    roots = [];
    for (let v = 0; v < Number(P.get('variants') ?? 3); v++) {
      const patch = new THREE.Group(); patch.name = `${asset}_patch_${v}`;
      for (let i = 0; i < n; i++) {
        const piece = pieces[Math.floor(rand() * pieces.length)].clone();
        // Denser toward the middle, so the patch has a soft outline.
        piece.position.set((rand() + rand() - 1) * w / 2, 0, (rand() - 0.5) * d);
        piece.rotation.y = rand() * Math.PI * 2;
        piece.scale.setScalar(s0 + (s1 - s0) * rand());
        patch.add(piece);
      }
      roots.push(patch);
    }
  }
  for (const r of roots) scene.add(r);

  // Needles are far thinner than a pixel, so every quantity is the average of
  // many renders with the camera (and the light) nudged by a fraction of a
  // pixel. Each render lands in `cell`; a float buffer adds them up.
  const JITTERS = Number(P.get('jitters') ?? 16);
  const SHADOW_SIZE = Math.min(8192, renderer.capabilities.maxTextureSize);
  sharedU.uTexel.value = 1 / SHADOW_SIZE;
  const cell = new THREE.WebGLRenderTarget(CW, CH, { samples: 4, depthBuffer: true });
  const floatTarget = () => new THREE.WebGLRenderTarget(CW, CH, { type: THREE.FloatType, depthBuffer: false });
  const scratch = floatTarget();
  const sunAcc = Array.from({ length: VIEWS }, floatTarget), skyAcc = Array.from({ length: VIEWS }, floatTarget);
  const shadow = new THREE.WebGLRenderTarget(SHADOW_SIZE, SHADOW_SIZE, { depthTexture: new THREE.DepthTexture(SHADOW_SIZE, SHADOW_SIZE, THREE.UnsignedIntType) });
  shadow.depthTexture.minFilter = shadow.depthTexture.magFilter = THREE.NearestFilter;
  const sums = new Float32Array(CW * CH * 4);
  const view = new THREE.OrthographicCamera(), lightCam = new THREE.OrthographicCamera();
  renderer.setClearColor(0x000000, 0);

  const adder = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
    uniforms: { uTex: { value: cell.texture } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: 'uniform sampler2D uTex; varying vec2 vUv; void main() { gl_FragColor = texture2D(uTex, vUv); }',
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
    blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneFactor, depthTest: false, depthWrite: false,
  }));
  adder.frustumCulled = false;
  const adderScene = new THREE.Scene(); adderScene.add(adder);
  const adderCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const clear = (target) => { renderer.setRenderTarget(target); renderer.clear(); };
  // Render the tree in one mode and add the result (colour x coverage, coverage) to `target`.
  function shootInto(target, mode) {
    sharedU.uMode.value = mode;
    renderer.setRenderTarget(cell);
    renderer.render(scene, view);
    renderer.setRenderTarget(target);
    renderer.autoClear = false;
    renderer.render(adderScene, adderCam);
    renderer.autoClear = true;
  }
  const read = (target) => { renderer.setRenderTarget(null); renderer.readRenderTargetPixels(target, 0, 0, CW, CH, sums); return sums; };
  const halton = (i, base) => { let f = 1, r = 0; while (i > 0) { f /= base; r += f * (i % base); i = Math.floor(i / base); } return r - 0.5; };

  function aimLight(dir, centre, radius, j) {
    const shift = 2 * radius / SHADOW_SIZE;
    const dx = halton(j + 1, 2) * shift, dy = halton(j + 1, 3) * shift;
    lightCam.left = -radius + dx; lightCam.right = radius + dx; lightCam.bottom = -radius + dy; lightCam.top = radius + dy;
    lightCam.near = 0.1; lightCam.far = radius * 4;
    lightCam.position.copy(centre).addScaledVector(dir, radius * 2);
    lightCam.up.set(0, 1, 0.001);
    lightCam.lookAt(centre);
    lightCam.updateProjectionMatrix(); lightCam.updateMatrixWorld();
    sharedU.uLightVP.value.multiplyMatrices(lightCam.projectionMatrix, lightCam.matrixWorldInverse);
    sharedU.uBias.value = 0.02 / (lightCam.far - lightCam.near); // 2 cm
    sharedU.uMode.value = 3;
    sharedU.uShadow.value = white; // the depth texture can't be bound while it is being drawn
    renderer.setRenderTarget(shadow);
    renderer.render(scene, lightCam);
    sharedU.uShadow.value = shadow.depthTexture;
  }
  // Directions spread over the sky for ambient visibility.
  const skyDirs = [];
  for (const [elev, n] of [[12, 12], [35, 10], [62, 7], [85, 3]]) {
    for (let i = 0; i < n; i++) {
      const az = (i + 0.37 * elev) / n * Math.PI * 2, e = elev * Math.PI / 180;
      skyDirs.push(new THREE.Vector3(Math.sin(az) * Math.cos(e), Math.sin(e), Math.cos(az) * Math.cos(e)));
    }
  }

  for (const [ti, root] of roots.entries()) {
    for (const r of roots) r.visible = r === root;
    root.updateMatrixWorld(true);
    // Extent about the trunk axis.
    let radial = 0, yMin = Infinity, yMax = -Infinity;
    const v = new THREE.Vector3();
    root.traverse((o) => {
      if (!o.isMesh || !o.visible) return;
      const p = o.geometry.attributes.position, used = o.geometry.index ? o.geometry.index.array : null;
      for (let q = 0; q < (used ? used.length : p.count); q += 3) { // every third vertex is plenty
        const i = used ? used[q] : q;
        v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld);
        radial = Math.max(radial, Math.hypot(v.x, v.z)); yMin = Math.min(yMin, v.y); yMax = Math.max(yMax, v.y);
      }
    });
    const pad = 0.03 * (yMax - yMin);
    const frameH = Math.max(yMax - yMin + 2 * pad, (2 * radial * 1.04) * CH / CW), frameW = frameH * CW / CH;
    const y0 = yMin - pad;
    const centre = new THREE.Vector3(0, (yMin + yMax) / 2, 0), radius = Math.hypot(radial, (yMax - yMin) / 2) * 1.02;

    const A = new Uint8Array(VIEWS * CW * CH * 4), B = new Uint8Array(VIEWS * CW * CH * 4);
    const aimView = (k, j) => {
      const th = k / VIEWS * Math.PI * 2;
      const dx = halton(j + 1, 2) * frameW / CW, dy = halton(j + 1, 3) * frameH / CH;
      view.left = -frameW / 2 + dx; view.right = frameW / 2 + dx; view.bottom = -frameH / 2 + dy; view.top = frameH / 2 + dy;
      view.near = 0.1; view.far = 200;
      view.position.set(Math.sin(th) * 100, y0 + frameH / 2, Math.cos(th) * 100);
      view.up.set(0, 1, 0);
      view.lookAt(0, y0 + frameH / 2, 0);
      view.updateProjectionMatrix(); view.updateMatrixWorld();
    };
    // Write (sum of value x coverage) / (sum of coverage) into byte channels of an atlas.
    const put = (dst, k, channels, src, coverageScale) => {
      for (let y = 0; y < CH; y++) {
        let d = (y * VIEWS * CW + k * CW) * 4, s = y * CW * 4;
        for (let x = 0; x < CW; x++, d += 4, s += 4) {
          const cov = src[s + 3];
          for (const [dc, sc] of channels) dst[d + dc] = cov > 1e-4 ? Math.min(255, 255 * src[s + sc] / cov + 0.5) : 0;
          if (coverageScale) dst[d + 3] = Math.min(255, 255 * cov * coverageScale + 0.5);
        }
      }
    };
    log(`${asset} tree ${ti + 1}/${roots.length}: colour and normals`);
    for (let k = 0; k < VIEWS; k++) {
      clear(scratch);
      for (let j = 0; j < JITTERS; j++) { aimView(k, j); shootInto(scratch, 0); }
      put(A, k, [[0, 0], [1, 1], [2, 2]], read(scratch), 1 / JITTERS);
      clear(scratch);
      for (let j = 0; j < JITTERS; j++) { aimView(k, j); shootInto(scratch, 1); }
      put(B, k, [[0, 0], [1, 1]], read(scratch));
      clear(sunAcc[k]); clear(skyAcc[k]);
    }
    await new Promise((r) => setTimeout(r));
    log(`${asset} tree ${ti + 1}/${roots.length}: sun`);
    for (let j = 0; j < JITTERS; j++) {
      aimLight(sun, centre, radius, j);
      for (let k = 0; k < VIEWS; k++) { aimView(k, j); shootInto(sunAcc[k], 2); }
    }
    for (const [di, dir] of skyDirs.entries()) {
      if (di % 8 === 0) { log(`${asset} tree ${ti + 1}/${roots.length}: sky ${di}/${skyDirs.length}`); await new Promise((r) => setTimeout(r)); }
      aimLight(dir, centre, radius, di);
      for (let k = 0; k < VIEWS; k++) { aimView(k, di); shootInto(skyAcc[k], 2); }
    }
    for (let k = 0; k < VIEWS; k++) {
      put(B, k, [[2, 0]], read(sunAcc[k]));
      put(B, k, [[3, 0]], read(skyAcc[k]));
    }
    window.__bake.trees.push({ name: root.name, frameW, frameH, y0, top: yMax, radial, width: VIEWS * CW, height: CH, A, B });
  }
  log('done');
  window.__bake.done = true;
} catch (e) {
  window.__bake.error = String(e.stack ?? e);
  log('error: ' + window.__bake.error);
}

// Hand a texture to the driver in base64 pieces (rows are bottom-up).
window.__bake.chunk = (tree, which, start, length) => {
  const bytes = window.__bake.trees[tree][which].subarray(start, start + length);
  let s = '';
  for (let i = 0; i < bytes.length; i += 32768) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
  return btoa(s);
};
</script>
